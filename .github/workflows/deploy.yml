name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar os arquivos do frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4